version: "3.9"

services:
  db:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: meubanco
      MYSQL_USER: usuario
      MYSQL_PASSWORD: senha
      MYSQL_ROOT_PASSWORD: senharoot

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - cms_network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: any

      resources:
        reservations:
          cpus: "0.25"
          memory: 256M

        limits:
          cpus: "1.00"
          memory: 1G

  api:
    image: sistema-site-cms:latest
    build: .

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/meubanco?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: usuario
      SPRING_DATASOURCE_PASSWORD: senha
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"

      # Limite da JVM
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"

    depends_on:
      - db

    networks:
      - cms_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      replicas: 1

      restart_policy:
        condition: any

      resources:
        reservations:
          cpus: "0.25"
          memory: 256M

        limits:
          cpus: "1.00"
          memory: 768M

volumes:
  mysql_data:

networks:
  cms_network:
    driver: overlay
    attachable: true
